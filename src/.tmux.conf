# Set the prefix key to be Ctrl+Space
unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

# Use mouse things
set -g mouse on

# Increase history
set-option -g history-limit 5000

# Better split commands
bind / split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

# Bar color
set -g status-style bg=colour019,fg=colour255

# Bar text
set -g status-right " %I:%M %p %Y-%m-%d"

# Bar tab formatting
set -g window-status-format "  #I:#W  "
set -g window-status-current-format "  #[bold,fg=white,bold,bg=colour234]#I:#W  "

# Key bindings for switching windows
bind -r h select-pane -L
bind -r l select-pane -R
bind -r k select-pane -U
bind -r j select-pane -D

# Switch from horizontal/vertical split
bind _ move-pane -t '.-'
bind | move-pane -h -t '.-'

